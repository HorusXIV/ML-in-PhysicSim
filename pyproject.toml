[project]
name = "physics-sim"
version = "0.1.0"
description = "Differentiable hexapod locomotion with MuJoCo MJX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11.1",
    "matplotlib>=3.11.1",
    "mediapy>=1.2.7",
    "mujoco>=3.10.0",
    "mujoco-mjx[warp]>=3.10.0",
    "optax>=0.2.8",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
# GPU wheels are ~3 GB and pointless on a CI runner, so they live in their own
# group. Still installed by default locally (see default-groups below);
# CI opts out with `uv sync --no-group cuda`.
cuda = ["jax[cuda12]>=0.11.1"]
dev = ["pytest>=8", "ruff>=0.14"]
notebook = ["ipykernel>=7.3.0", "notebook>=7.6.1"]

[tool.uv]
default-groups = ["cuda", "dev", "notebook"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

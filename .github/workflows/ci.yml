name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Otherwise every `uv run` re-syncs the default groups and pulls the CUDA
      # and notebook wheels straight back in after the sync below excluded them.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No GPU on the runner, so skip the CUDA wheels. JAX falls back to CPU.
      - run: uv sync --no-group cuda --no-group notebook

      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

      - run: uv run pytest -q
